    function onSpeedKeypadDigit(digit) {
      const list = getFilteredStudents();
      const std = list[state.speedConfig.activeIndex];
      if (!std) return;
      const activeSub = getActiveSub();
      const maxG = getMaxAllowedGrade();
      const g = getSubjectGrades(std.id, activeSub);
      const key = getSpeedFieldKey(state.speedConfig.activeTab, state.speedConfig.activeSubFieldIdx);

      const prev = state.speedConfig.freshSelection ? "" : String(g[key] || "");
      const candidate = prev === "0" ? String(digit) : (prev + String(digit));
      const num = parseInt(candidate, 10);

      if (num > maxG) {
        showToast(`⚠️ الحد الأعلى للدرجة في هذا الصف هو (${maxG})`);
        return;
      }

      g[key] = String(num);
      state.speedConfig.freshSelection = false;
      saveState();

      // Auto advance if 2 digits entered (for maxG=100) or 1 digit >=2 (for maxG=10)
      if (state.speedConfig.autoAdvance) {
        if ((maxG === 10 && (num >= 2 || candidate.length >= 2)) || (maxG === 100 && candidate.length >= 2)) {
          advanceSpeedField();
          return;
        }
      }
      renderSpeedGradingStudio();
    }

    function onSpeedSetDirectValue(valStr) {
      const list = getFilteredStudents();
      const std = list[state.speedConfig.activeIndex];
      if (!std) return;
      const g = getSubjectGrades(std.id, getActiveSub());
      const key = getSpeedFieldKey(state.speedConfig.activeTab, state.speedConfig.activeSubFieldIdx);
      g[key] = valStr;
      saveState();
      if (state.speedConfig.autoAdvance) advanceSpeedField();
      else renderSpeedGradingStudio();
    }

    function onSpeedKeypadClear() {
      const list = getFilteredStudents();
      const std = list[state.speedConfig.activeIndex];
      if (!std) return;
      const g = getSubjectGrades(std.id, getActiveSub());
      const key = getSpeedFieldKey(state.speedConfig.activeTab, state.speedConfig.activeSubFieldIdx);
      g[key] = "";
      state.speedConfig.freshSelection = true;
      saveState();
      renderSpeedGradingStudio();
    }

    function advanceSpeedField() {
      const list = getFilteredStudents();
      const isMonthly = ["m1", "m2", "m3", "m4"].includes(state.speedConfig.activeTab);
      state.speedConfig.freshSelection = true;
      if (isMonthly && state.speedConfig.activeSubFieldIdx < 2) {
        state.speedConfig.activeSubFieldIdx++;
      } else {
        state.speedConfig.activeSubFieldIdx = 0;
        if (state.speedConfig.activeIndex + 1 < list.length) {
          state.speedConfig.activeIndex++;
        } else {
          showToast("اكتمل رصد جميع طلاب القائمة بنجاح 🎉");
        }
      }
      renderSpeedGradingStudio();
    }

    function startWebVoiceGrading() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        const manual = prompt("🎙️ أدخل الدرجة أو 3 درجات مفصولة بمسافة (يومي عملي تحريري):");
        if (manual) applySpokenGradeString(manual);
        return;
      }
      const rec = new SpeechRec();
      rec.lang = "ar-IQ";
      rec.interimResults = false;
      showToast("🎙️ تفضل بنطق الدرجة الآن...");
      rec.onresult = (ev) => {
        const transcript = ev.results?.[0]?.[0]?.transcript || "";
        applySpokenGradeString(transcript);
      };
      rec.onerror = () => showToast("تعذر التقاط الصوت، حاول مرة أخرى 🎙️");
      rec.start();
    }

    function applySpokenGradeString(text) {
      const nums = (text.match(/\d+/g) || []).map(n => parseInt(n, 10));
      if (nums.length === 0) {
        showToast(`لم يتم التعرف على رقم في: (${text})`);
        return;
      }
      const list = getFilteredStudents();
      const std = list[state.speedConfig.activeIndex];
      if (!std) return;
      const g = getSubjectGrades(std.id, getActiveSub());
      const tab = state.speedConfig.activeTab;
      const isMonthly = ["m1", "m2", "m3", "m4"].includes(tab);

      if (isMonthly && nums.length >= 3) {
        g[getSpeedFieldKey(tab, 0)] = String(nums[0]);
        g[getSpeedFieldKey(tab, 1)] = String(nums[1]);
        g[getSpeedFieldKey(tab, 2)] = String(nums[2]);
        saveState();
        advanceSpeedField();
      } else {
        onSpeedSetDirectValue(String(nums[0]));
      }
    }

     * 8. OFFICIAL PRINT PREVIEW STUDIO (1:1 Match with OfficialPrintPreviewScreen)
     *************************************************************************/

      state.printConfig.templateType = defaultTemplate;

    function exportExcelCsv() {
      const activeSub = getActiveSub();
      const maxG = getMaxAllowedGrade();
      const list = getFilteredStudents();
      const rows = [
        ["ت", "اسم الطالب", "الشعبة", "نظام الدوام", "ف1 ش1", "ف1 ش2", "معدل ف1", "نصف السنة", "ف2 ش1", "ف2 ش2", "معدل ف2", "السعي السنوي", "الامتحان النهائي", "درجة القرار", "الدور الثاني", "النتيجة النهائية"]
      ];
      list.forEach((s, i) => {
        const r = calculateResult(s.id, activeSub);
        const effSaei = Math.min(maxG, r.saei + r.qarar);
        const finalSc = r.secondRoundResult ?? (r.hasFinalResult ? r.finalResult : effSaei);
        rows.push([
          i + 1,
          s.name,
          s.section,
          s.isIntisab ? "انتساب" : "نظامي",
          r.hasM1 ? r.m1 : "",
          r.hasM2 ? r.m2 : "",
          r.hasAvg1 ? r.avg1 : "",
          r.hasMid ? r.mid : "",
          r.hasM3 ? r.m3 : "",
          r.hasM4 ? r.m4 : "",
          r.hasAvg2 ? r.avg2 : "",
          r.hasSaei ? effSaei : "",
          r.hasFinal ? r.finalExam : "",
          r.qarar || 0,
          r.hasSecondRound ? r.secondRoundExam : "",
          r.hasSaei ? finalSc : ""
        ]);
      });
      const csv = "\uFEFF" + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `سجل_${getCurrentStage().name}_${activeSub}_${todayIso()}.csv`;
      a.click();
      showToast("تم تصدير ملف الإكسل (CSV) بنجاح 📊");
    }

    /*************************************************************************
     * 10. REMOTE OTA AUTO-UPDATE CHECKER (Matching GoogleDriveUpdateManager.kt)
     *************************************************************************/
    async function checkRemoteOtaUpdate(manual = false) {
      try {
        const res = await fetch("https://ntfy.sh/bousalat_alustadh_waad_ota_v1/json?poll=1&since=30d");
        if (!res.ok) {
          if (manual) showToast("أنت تعمل على أحدث إصدار v4.4 ✅");
          return;
        }
        const text = await res.text();
        const lines = text.trim().split("\n").filter(Boolean);
        let latestPayload = null;

        for (let i = lines.length - 1; i >= 0; i--) {
          try {
            const env = JSON.parse(lines[i]);
            if (env.event === "message" && env.message) {
              const data = JSON.parse(env.message);
              if (data.type === "BOUSALAT_OTA_UPDATE" && data.driveUrl) {
                latestPayload = Object.assign({ broadcastId: env.id }, data);
                break;
              }
            }
          } catch (_) {}
        }

        if (!latestPayload) {
          if (manual) showToast("أنت تعمل على أحدث إصدار v4.4 ✅");
          return;
        }

        const remoteCode = parseInt(latestPayload.versionCode || 0, 10);
        const isNewer = remoteCode > APP_VERSION_CODE;
        const alreadyAck = state.acknowledgedOta?.id === latestPayload.broadcastId || (remoteCode > 0 && remoteCode <= (state.acknowledgedOta?.versionCode || APP_VERSION_CODE));

        if (!isNewer || (!manual && alreadyAck)) {
          if (manual) showToast(`أنت تعمل على أحدث إصدار v${APP_VERSION_NAME} ✅`);
          return;
        }

        state.pendingOtaPayload = latestPayload;
        document.getElementById("otaUpdateVersionBadge").textContent = `الإصدار الجديد: v${latestPayload.versionName || "حديث"}`;
        const notesEl = document.getElementById("otaUpdateNotes");
        if (latestPayload.releaseNotes) {
          notesEl.textContent = latestPayload.releaseNotes;
          notesEl.style.display = "block";
        } else {
          notesEl.style.display = "none";
        }
        document.getElementById("otaUpdateBackdrop").style.display = "flex";
      } catch (e) {
        if (manual) showToast("أنت تعمل على أحدث إصدار v4.4 ✅");
      }
    }

    function confirmOtaUpdateNow() {
      const p = state.pendingOtaPayload;
      if (p) {
        state.acknowledgedOta = {
          id: p.broadcastId || "",
          versionName: p.versionName || APP_VERSION_NAME,
          versionCode: Math.max(APP_VERSION_CODE, parseInt(p.versionCode || APP_VERSION_CODE, 10))
        };
        saveState();
        document.getElementById("otaUpdateBackdrop").style.display = "none";
        if (p.driveUrl) {
          window.location.href = p.driveUrl;
        }
      }
    }

    function dismissOtaUpdate() {
      const p = state.pendingOtaPayload;
      if (p) {
        state.acknowledgedOta = {
          id: p.broadcastId || "",
          versionName: p.versionName || APP_VERSION_NAME,
          versionCode: Math.max(APP_VERSION_CODE, parseInt(p.versionCode || APP_VERSION_CODE, 10))
        };
        saveState();
      }
      document.getElementById("otaUpdateBackdrop").style.display = "none";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function render() {
      const main = document.getElementById("appMain");
      if (!main) return;
      if (state.isLocked && state.savedPin) {
        document.getElementById("pinLockOverlay").style.display = "flex";
      }

      if (state.view === "dashboard") main.innerHTML = renderDashboardView();
      else if (state.view === "students") main.innerHTML = renderStudentsView();
      else if (state.view === "add") main.innerHTML = renderAddStudentView();
      else if (state.view === "attendance") main.innerHTML = renderAttendanceView();
      else if (state.view === "schedule") main.innerHTML = renderScheduleView();
      else if (state.view === "settings") main.innerHTML = renderSettingsView();
    }

    // Generate crisp 180x180 Apple Touch Icon dynamically as fallback + register PWA Service Worker
    function initIosPwaEnhancements() {
      try {
        // Request persistent storage so iOS Safari never clears localStorage
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist();
        }
        // Register Service Worker for offline classroom access on GitHub Pages
        if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
        // Show iOS install hint if running inside browser tab (not standalone) and not dismissed
        const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
        const bannerDismissed = localStorage.getItem("waad_ios_banner_dismissed") === "1";
        if (!isStandalone && !bannerDismissed) {
          const banner = document.getElementById("iosInstallBanner");
          if (banner) banner.style.display = "block";
        }
      } catch (_) {}
    }

    function dismissIosBanner() {
      localStorage.setItem("waad_ios_banner_dismissed", "1");
      const banner = document.getElementById("iosInstallBanner");
      if (banner) banner.style.display = "none";
    }

    // Initialize Application
    loadState();
    render();
    initIosPwaEnhancements();
    setTimeout(() => checkRemoteOtaUpdate(false), 2500);
  </script>
</body>
</html>
